                                            If(locDashAll, Filter(dis_trx_headers, 'Created On' >= DateAdd(Today(), -29, TimeUnit.Days)), Filter(dis_trx_headers, 'Created On' >= DateAdd(Today(), -29, TimeUnit.Days), 'Created By'.User = nfMySysUserId)),
                                            'Created On',
                                            SortOrder.Descending
                                        ),
                                        area_form.dis_area in nfMyAreaIds Or area_to.dis_area in nfMyAreaIds
                                    ),
                                    10
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Selectable: =false
                              ShowScrollbar: =false
                              TemplateFill: =RGBA(255, 255, 255, 1)
                              TemplatePadding: =0
                              TemplateSize: =56
                            Children:
                              - txtDashRecNo:
                                  Control: ModernText
                                  Properties:
                                    Color: =RGBA(31, 41, 55, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: =ThisItem.transaction_number
                                    Width: =Parent.TemplateWidth - 120
                                    Wrap: =false
                                    X: =4
                                    Y: =6
                              - txtDashRecMeta:
                                  Control: ModernText
                                  Properties:
                                    Color: =RGBA(100, 112, 130, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =20
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Text: |-
                                      =Text(ThisItem.'Created On', "dd mmm, hh:mm") & "  ·  " & If(ThisItem.type = 'type (dis_trx_headers)'.Receive, "Received", Coalesce(ThisItem.area_form.Name, "-")) & " → " & If(ThisItem.type = 'type (dis_trx_headers)'.Consume, "Consumed", Coalesce(ThisItem.area_to.Name, "-"))
                                    Width: =Parent.TemplateWidth - 120
                                    Wrap: =false
                                    X: =4
                                    Y: =30
                              - bdgDashRecType:
                                  Control: Badge
                                  Properties:
                                    AccessibleLabel: ="Type " & Text(ThisItem.type)
                                    Appearance: ='BadgeCanvas.Appearance'.Tint
                                    Content: =Text(ThisItem.type)
                                    FontSize: =11
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    Shape: ='BadgeCanvas.Shape'.Circular
                                    ThemeColor: =Switch(Text(ThisItem.type), "Receive", 'BadgeCanvas.ThemeColor'.Success, "Consume", 'BadgeCanvas.ThemeColor'.Warning, "Transfer", 'BadgeCanvas.ThemeColor'.Brand, 'BadgeCanvas.ThemeColor'.Subtle)
                                    Width: =88
                                    X: =Parent.TemplateWidth - 92
                                    Y: =16
                        - txtDashRecEmpty:
                            Control: ModernText
                            Properties:
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(100, 112, 130, 1)
                              Font: =Font.'Segoe UI'
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =13
                              Text: ="No transactions in the last 30 days."
                              Visible: =IsEmpty(galDashRecent.AllItems)
            - cmpDashTabBar:
                Control: CanvasComponent
                ComponentName: cmpTabBar
                Properties:
                  ActiveTab: ="Dashboard"
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =72
                  LayoutMinHeight: =72
                  LayoutMinWidth: =0
