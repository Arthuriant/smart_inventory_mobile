                              Color: =RGBA(31, 41, 55, 1)
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =4
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: =Text(Today(), "dddd, dd mmmm yyyy", "en-US")
                              Wrap: =false
                        - btnDashRefresh:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Refresh dashboard"
                              Appearance: =ButtonAppearance.Subtle
                              Color: =RGBA(0, 18, 107, 1)
                              Height: =40
                              Icon: ="ArrowSync"
                              Layout: =ButtonLayout.IconOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Refresh(dis_trx_headers)
                              RadiusBottomLeft: =20
                              RadiusBottomRight: =20
                              RadiusTopLeft: =20
                              RadiusTopRight: =20
                              Size: =18
                              Text: ="Refresh dashboard"
                              Width: =40
