Screens:
  scr_m_dashboard:
    Properties:
      Fill: =RGBA(244, 246, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - conDashRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(244, 246, 250, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cmpDashHeader:
                Control: CanvasComponent
                ComponentName: cmpHeader
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =88
                  LayoutMinHeight: =88
                  LayoutMinWidth: =0
                  Title: ="Dashboard"
            - conDashBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
