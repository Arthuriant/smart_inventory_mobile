                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                              Size: =20
                              Text: ="Dashboard"
                  - btnTbDash:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Open Dashboard"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Transparent
                        Color: =If(cmpTabBar.ActiveTab = "Dashboard", RGBA(0, 18, 107, 1), RGBA(100, 112, 130, 1))
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(cmpTabBar.ActiveTab = "Dashboard", FontWeight.Bold, FontWeight.Normal)
                        Height: =22
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =If(cmpTabBar.ActiveTab <> "Dashboard", Navigate(scr_m_dashboard, ScreenTransition.None))
                        PaddingBottom: =0
