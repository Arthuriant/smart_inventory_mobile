ComponentDefinitions:
  cmpTabBar:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      ActiveTab:
        PropertyKind: Input
        DisplayName: ActiveTab
        Description: "Active tab: Consume, History or Dashboard"
        DataType: Text
        Default: =""
    Properties:
      Height: =72
      Width: =640
    Children:
      - conTbRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.Semilight
            Fill: =RGBA(255, 255, 255, 1)
            Height: =cmpTabBar.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingBottom: =6
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =20
            RadiusTopRight: =20
            Width: =cmpTabBar.Width
          Children:
            - conTbCons:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =2
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conTbConsInd:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        DropShadow: =DropShadow.None
                        Fill: =If(cmpTabBar.ActiveTab = "Consume", RGBA(226, 234, 252, 1), RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Width: =64
                      Children:
                        - btnTbConsIco:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Open Consume"
                              Appearance: =ButtonAppearance.Transparent
                              Color: =If(cmpTabBar.ActiveTab = "Consume", RGBA(0, 18, 107, 1), RGBA(100, 112, 130, 1))
                              FillPortions: =1
                              Height: =32
                              Icon: ="Wrench"
                              IconStyle: =If(cmpTabBar.ActiveTab = "Consume", IconStyle.Filled, IconStyle.Outline)
                              Layout: =ButtonLayout.IconOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =If(cmpTabBar.ActiveTab <> "Consume", Navigate(scr_m_consume, ScreenTransition.None))
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                              Size: =20
                              Text: ="Consume"
                  - btnTbCons:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Open Consume"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Transparent
                        Color: =If(cmpTabBar.ActiveTab = "Consume", RGBA(0, 18, 107, 1), RGBA(100, 112, 130, 1))
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(cmpTabBar.ActiveTab = "Consume", FontWeight.Bold, FontWeight.Normal)
                        Height: =22
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =If(cmpTabBar.ActiveTab <> "Consume", Navigate(scr_m_consume, ScreenTransition.None))
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =11
                        Text: ="Consume"
                        Width: =Parent.Width
            - conTbHist:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =2
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conTbHistInd:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        DropShadow: =DropShadow.None
                        Fill: =If(cmpTabBar.ActiveTab = "History", RGBA(226, 234, 252, 1), RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Width: =64
                      Children:
                        - btnTbHistIco:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Open History"
                              Appearance: =ButtonAppearance.Transparent
                              Color: =If(cmpTabBar.ActiveTab = "History", RGBA(0, 18, 107, 1), RGBA(100, 112, 130, 1))
                              FillPortions: =1
                              Height: =32
                              Icon: ="History"
                              IconStyle: =If(cmpTabBar.ActiveTab = "History", IconStyle.Filled, IconStyle.Outline)
                              Layout: =ButtonLayout.IconOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =If(cmpTabBar.ActiveTab <> "History", Navigate(scr_m_history, ScreenTransition.None))
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                              Size: =20
                              Text: ="History"
                  - btnTbHist:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Open History"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Transparent
                        Color: =If(cmpTabBar.ActiveTab = "History", RGBA(0, 18, 107, 1), RGBA(100, 112, 130, 1))
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(cmpTabBar.ActiveTab = "History", FontWeight.Bold, FontWeight.Normal)
                        Height: =22
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =If(cmpTabBar.ActiveTab <> "History", Navigate(scr_m_history, ScreenTransition.None))
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =11
                        Text: ="History"
                        Width: =Parent.Width
            - conTbDash:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =2
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conTbDashInd:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        DropShadow: =DropShadow.None
                        Fill: =If(cmpTabBar.ActiveTab = "Dashboard", RGBA(226, 234, 252, 1), RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Width: =64
                      Children:
                        - btnTbDashIco:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Open Dashboard"
                              Appearance: =ButtonAppearance.Transparent
                              Color: =If(cmpTabBar.ActiveTab = "Dashboard", RGBA(0, 18, 107, 1), RGBA(100, 112, 130, 1))
                              FillPortions: =1
                              Height: =32
