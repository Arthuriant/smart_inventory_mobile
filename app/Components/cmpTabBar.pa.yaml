ComponentDefinitions:
  cmpTabBar:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      ActiveTab:
        PropertyKind: Input
        DisplayName: ActiveTab
        Description: "Active tab: Consume, History or Dashboard"
        DataType: Text
        Default: =""
    Properties:
      Height: =72
      Width: =640
    Children:
      - conTbRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            BorderColor: =RGBA(226, 230, 239, 1)
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =cmpTabBar.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingBottom: =4
            PaddingLeft: =4
            PaddingRight: =4
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =cmpTabBar.Width
          Children:
            - conTbCons:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conTbConsInd:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(cmpTabBar.ActiveTab = "Consume", RGBA(0, 18, 107, 1), RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        Height: =3
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =2
                        RadiusBottomRight: =2
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                  - btnTbCons:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Open Consume"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Color: =If(cmpTabBar.ActiveTab = "Consume", RGBA(0, 18, 107, 1), RGBA(100, 112, 130, 1))
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(cmpTabBar.ActiveTab = "Consume", FontWeight.Bold, FontWeight.Normal)
                        Icon: ="Wrench"
                        IconStyle: =If(cmpTabBar.ActiveTab = "Consume", IconStyle.Filled, IconStyle.Outline)
                        LayoutMinHeight: =44
                        LayoutMinWidth: =0
                        OnSelect: =If(cmpTabBar.ActiveTab <> "Consume", Navigate(scr_m_consume, ScreenTransition.None))
                        PaddingLeft: =2
                        PaddingRight: =2
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =12
                        Text: ="Consume"
            - conTbHist:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conTbHistInd:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(cmpTabBar.ActiveTab = "History", RGBA(0, 18, 107, 1), RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        Height: =3
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =2
                        RadiusBottomRight: =2
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                  - btnTbHist:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Open History"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Color: =If(cmpTabBar.ActiveTab = "History", RGBA(0, 18, 107, 1), RGBA(100, 112, 130, 1))
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(cmpTabBar.ActiveTab = "History", FontWeight.Bold, FontWeight.Normal)
                        Icon: ="History"
                        IconStyle: =If(cmpTabBar.ActiveTab = "History", IconStyle.Filled, IconStyle.Outline)
                        LayoutMinHeight: =44
                        LayoutMinWidth: =0
                        OnSelect: =If(cmpTabBar.ActiveTab <> "History", Navigate(scr_m_history, ScreenTransition.None))
                        PaddingLeft: =2
                        PaddingRight: =2
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =12
                        Text: ="History"
            - conTbDash:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conTbDashInd:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(cmpTabBar.ActiveTab = "Dashboard", RGBA(0, 18, 107, 1), RGBA(0, 0, 0, 0))
                        FillPortions: =0
                        Height: =3
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =2
                        RadiusBottomRight: =2
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                  - btnTbDash:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Open Dashboard"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Color: =If(cmpTabBar.ActiveTab = "Dashboard", RGBA(0, 18, 107, 1), RGBA(100, 112, 130, 1))
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(cmpTabBar.ActiveTab = "Dashboard", FontWeight.Bold, FontWeight.Normal)
                        Icon: ="Home"
                        IconStyle: =If(cmpTabBar.ActiveTab = "Dashboard", IconStyle.Filled, IconStyle.Outline)
                        LayoutMinHeight: =44
                        LayoutMinWidth: =0
                        OnSelect: =If(cmpTabBar.ActiveTab <> "Dashboard", Navigate(scr_m_dashboard, ScreenTransition.None))
                        PaddingLeft: =2
                        PaddingRight: =2
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =12
                        Text: ="Dashboard"
