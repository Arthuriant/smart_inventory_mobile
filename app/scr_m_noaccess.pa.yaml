Screens:
  scr_m_noaccess:
    Properties:
      Fill: =RGBA(244, 246, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - conNaRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(244, 246, 250, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conNaBrand:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 18, 107, 1)
                  Height: =128
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =24
                  PaddingRight: =24
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - txtNaBrand:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =22
                        Text: ="DIGITAL INVENTORY"
                        Wrap: =false
                  - txtNaTag:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(255, 255, 255, 0.8)
                        Font: =Font.'Segoe UI'
                        Height: =22
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="Technician mobile"
                        Wrap: =false
            - conNaBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - txtNaHello:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(31, 41, 55, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =34
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =20
                        Text: ="Hello, " & Coalesce(nfMe.Name, User().FullName)
                        Wrap: =false
                  - txtNaMsg:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(100, 112, 130, 1)
                        Font: =Font.'Segoe UI'
                        Height: =96
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: |-
                          =If(IsBlank(nfMe.Name), "Your account (" & User().Email & ") is not registered in Digital Inventory yet. Please contact one of the administrators below to register.", "Your account has no Sub Business Line yet, so no area stock can be shown. Please contact one of the administrators below.")
                  - txtNaAdmins:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(100, 112, 130, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: ="ADMINISTRATORS"
                        Wrap: =false
                  - galNaAdmins:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: ="Administrator list"
                        Fill: =RGBA(226, 230, 239, 1)
                        FillPortions: =1
                        Items: =Sort(Filter(dis_users, role = dis_role.administrator), Name)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Selectable: =false
                        TemplateFill: =RGBA(255, 255, 255, 1)
                        TemplatePadding: =1
                        TemplateSize: =72
                        Visible: =!IsEmpty(Filter(dis_users, role = dis_role.administrator))
                      Children:
                        - txtNaAdmInfo:
                            Control: ModernText
                            Properties:
                              Color: =RGBA(31, 41, 55, 1)
                              Font: =Font.'Segoe UI'
                              Height: =56
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: =ThisItem.Name & Char(10) & ThisItem.email
                              Width: =Parent.TemplateWidth - 88
                              X: =16
                              Y: =(Parent.TemplateHeight - Self.Height) / 2
                        - btnNaAdmMail:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Send email to " & ThisItem.Name
                              Appearance: =ButtonAppearance.Subtle
                              Color: =RGBA(56, 96, 178, 1)
                              Height: =48
                              Icon: ="Mail"
                              Layout: =ButtonLayout.IconOnly
                              OnSelect: =Launch("mailto:" & ThisItem.email)
                              Size: =16
                              Text: ="Send email to " & ThisItem.Name
                              Width: =48
                              X: =Parent.TemplateWidth - Self.Width - 12
                              Y: =(Parent.TemplateHeight - Self.Height) / 2
                  - txtNaEmpty:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(100, 112, 130, 1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =13
                        Text: ="No administrators registered yet."
                        Visible: =IsEmpty(Filter(dis_users, role = dis_role.administrator))
                  - btnNaRetry:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Check access again"
                        AlignInContainer: =AlignInContainer.Stretch
                        BasePaletteColor: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =48
                        Icon: ="ArrowSync"
                        LayoutMinHeight: =48
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Refresh(dis_users);
                          If(
                              nfHasAccess,
                              Navigate(scr_m_consume, ScreenTransition.None),
                              Notify("Access is still not available. Please contact an administrator.", NotificationType.Warning)
                          )
                        Size: =14
                        Text: ="Check again"
